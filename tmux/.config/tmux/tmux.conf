
set -g default-shell $SHELL
set -g default-terminal "tmux-256color"
set -as terminal-features ',tmux-256color:clipboard'

# set-environment -g "LC_ALL" "en_US.UTF-8"
# set-option -sa terminal-overrides ',xterm-256color:RGB'
set-option -g focus-events on


# mouse 
set -g mouse on
set -s escape-time 0 # time between keys
set -s set-clipboard on
set -g mode-keys vi

#######################
#### DESIGN CHANGES ###
#######################

## loud or quiet?
set -g visual-activity on
set -g monitor-activity on 
set -g bell-action none

##  modes
setw -g clock-mode-colour colour5
# setw -g mode-style 'fg=colour1 bg=colour18 bold'
# COLORSCHEME: gruvbox dark
set-option -g status "on"
# # default statusbar color
set-option -g status-style bg=colour237,fg=colour223 # bg=bg1, fg=fg1
# default window title colors
set-window-option -g window-status-style bg=colour214,fg=colour237 # bg=yellow, fg=bg1
# default window with an activity alert
set-window-option -g window-status-activity-style bg=colour237,fg=colour248 # bg=bg1, fg=fg3
# active window title colors
set-window-option -g window-status-current-style bg=colour6,fg=colour237

set-window-option -g window-status-separator " "
set-option -g window-status-format "#[fg=colour251] #I #W "
set -g window-status-style  "bg=colour241"
set-option -g window-status-current-format " #I #W "

set-option -g status-left "#[bg=colour241] #S #[fg=colour241, bg=colour237, nobold, noitalics, nounderscore]"
set-option -g status-right "#[fg=colour239, bg=colour237, bold, nounderscore, noitalics]#[fg=colour250,bg=colour239] %Y-%m-%d %H:%M #[fg=colour250, bg=colour239, bold, noitalics, nounderscore]"
## pane border
# set -g pane-border-format " #{pane_index} "

# set -g pane-border-status top
set-option -g pane-active-border-style fg=colour239 #fg2
set-option -g pane-border-style fg=colour235 #bg1
#
#  # writing commands inactive
set-option -g message-command-style bg=colour239,fg=colour223 # bg=fg3, fg=bg1
#
#  # clock
#  set-window-option -g clock-mode-colour colour109 #blue
#  # bell
#  set-window-option -g window-status-bell-style bg=colour167,fg=colour235 # bg=red, fg=bg
#
# dont rename window automatically
set-option -g allow-rename off


# ------------ Key bindings

bind r source-file $HOME/.config/tmux/tmux.conf
bind m run "S=$(tmux new -dP); tmux movew -t $S"

## split panes using | and -
bind | split-window -hb -c "#{pane_current_path}"
bind - split-window -vb -c "#{pane_current_path}"
bind c new-window   -c "#{pane_current_path}"
# bind _ split-window -v -c "#{pane_current_path}"


bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "xclip -i -f -selection primary | xclip -i -selection clipboard"

if-shell "[[ $(uname) == 'Darwin' ]]" {
bind -T copy-mode-vi Enter send-keys -X copy-pipe-and-cancel "pbcopy"
}

unbind %

# pane movement
bind-key @   choose-window 'join-pane -h -s "%%"'
bind-key C-@ choose-window 'join-pane    -s "%%"'
bind-key -n M-Right select-pane -R
bind ^ new-session
bind Q kill-pane

bind-key h set-option status

# respawn pane without prompt
bind X respawn-pane -k


# ------------- Plugins

if "test ! -d ~/.tmux/plugins/tpm" \
   "run 'git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm && ~/.tmux/plugins/tpm/bin/install_plugins'"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'

set -g @plugin 'tmux-plugins/tmux-sensible'
# set -g @plugin 'tmux-plugins/tmux-sidebar'
set -g @plugin 'egel/tmux-gruvbox'
set -g @tmux-gruvbox 'dark'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'github_username/plugin_name#branch'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'


# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
